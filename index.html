<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戰鬥陀螺 2026 LTCUP 黃光盃 G4 第一屆大賽</title>
<!--
  2026-10-08 使用者：「獨立小工作，幫我生成動畫網頁，參考這張海報」→ 會動的海報（字、陀螺、四大天王都用海報本身素材）
  2026-10-09 使用者：「你要不要把整個動畫重新編排」→ 選「動畫預告片式」＋特寫只放 1P～4P。分鏡（約 14 秒後定格成海報）：
    0–1.6   全黑，場館燈一盞盞亮起（喀）
    1.6–3.1 3・2・1，鏡頭慢慢往前推（電影黑邊）
    3.1–8.2 GO SHOOT! 白閃 → 陀螺對戰影片放大特寫，撞擊時畫面震；8.2 大爆炸全白閃
    8.4–10  煙霧散開、影片縮回海報中間（鏡頭拉遠），「戰鬥陀螺」重擊落下、下兩行滑入
    10.3–13.2 四大天王一人一張斜切特寫（1P～4P），特寫退場時本人落進海報位置
    13.4–14 資訊條左右飛入合體（五樓會議室／10/13 17:50），開賽倒數出現
    之後   定格海報：陀螺影片在中間循環（撞擊／爆炸時輕震＋音效）、標題掃光、人物待機晃動
  素材：base.webp（底圖：人＝黑色剪影、標題區模糊）、battle.mp4（Gemini 生成、只裁碗型場＋兩顆陀螺；撞擊 2.65／爆炸 6.28／再撞 9.15 秒）、
        title_a／title_b.webp（標題兩段）、title_mask.png（掃光遮罩）、p1～p4.png（四大天王去背）、bar.webp（資訊條）、poster.webp（看海報用）、
        top_blue／top_red.png（沒有影片時的備案：原地轉的陀螺）。
  音效：右上「🔇 音效」（瀏覽器規定要點一下才能出聲），Web Audio 即時合成。獨立靜態頁：不用登入、沒有外部資源。
-->
<style>
  :root { --gold1:#fff3b0; --gold2:#ffc93c; --gold3:#c47a00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color: #fff; }
  img { display: block; -webkit-user-drag: none; user-select: none; }

  .bgblur { position: fixed; inset: -8%; background: url(poster.webp) center / cover; filter: blur(28px) brightness(.4) saturate(1.2); opacity: 0; transition: opacity 1.2s; }
  .bgblur.on { opacity: 1; }
  .stage { position: absolute; left: 50%; top: 50%; --w: min(100vw, calc(100vh * 768 / 1376)); --h: calc(var(--w) * 1376 / 768);
    width: var(--w); height: var(--h); transform: translate(-50%, -50%); overflow: hidden; background: #000; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .cam > *, .stage > * { position: absolute; }
  .full { inset: 0; width: 100%; height: 100%; }
  .P { --pw: 768; --ph: 1376; }   /* 海報座標換算用 */
  .hide { opacity: 0; }
  .fade { transition: opacity .6s; }

  /* ① 場館燈 */
  .light { top: -12%; width: 30%; height: 80%; transform-origin: 50% 0; opacity: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(to bottom, rgba(210,230,255,.75), rgba(160,200,255,.18) 45%, transparent 80%); filter: blur(3px);
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
  .light.on { animation: lightOn .5s steps(1) forwards, sway 6s .5s ease-in-out infinite alternate; }
  @keyframes lightOn { 0% { opacity: .9; } 10% { opacity: .1; } 25% { opacity: .9; } 35% { opacity: .3; } 50%, 100% { opacity: 1; } }
  @keyframes sway { from { transform: rotate(var(--r0)); } to { transform: rotate(var(--r1)); } }
  .lights.dim .light { transition: opacity 1.2s; opacity: .35 !important; }
  .haze { inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 18%, rgba(120,160,255,.18), transparent 70%); opacity: 0; transition: opacity 1s; }
  .haze.on { opacity: 1; }

  /* 電影黑邊 */
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 30; transition: height .6s cubic-bezier(.3,0,.2,1); }
  .bars::before { top: 0; } .bars::after { bottom: 0; }
  .bars.on::before, .bars.on::after { height: 12%; }
  .bars { inset: 0; pointer-events: none; z-index: 30; }

  /* 底圖（海報、人＝剪影、標題區模糊） */
  .base { opacity: 0; transition: opacity 1s; }
  .base.on { opacity: 1; }
  .dimtops { left: 0; width: 100%; top: calc(430 / 1376 * 100%); height: calc(400 / 1376 * 100%); opacity: 0; transition: opacity 1s;
    background: radial-gradient(ellipse 70% 58% at 50% 50%, rgba(4,6,14,.94) 55%, rgba(4,6,14,.6) 75%, transparent 100%); }
  .dimtops.on { opacity: 1; }

  /* 陀螺影片：特寫（滿版中間）↔ 海報位置，用 transition 做鏡頭拉遠 */
  .vband { opacity: 0; transition: left 1.1s cubic-bezier(.5,0,.15,1), top 1.1s cubic-bezier(.5,0,.15,1), width 1.1s cubic-bezier(.5,0,.15,1), height 1.1s cubic-bezier(.5,0,.15,1), opacity .25s;
    left: calc(-76 / 768 * 100%); width: calc(920 / 768 * 100%); top: calc(480 / 1376 * 100%); height: calc(280 / 1376 * 100%);
    -webkit-mask: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent), linear-gradient(to right, transparent 4%, #000 14%, #000 86%, transparent 96%);
    -webkit-mask-composite: source-in; mask: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent), linear-gradient(to right, transparent 4%, #000 14%, #000 86%, transparent 96%);
    mask-composite: intersect; }
  .vband.close { --vh: calc(var(--h) * .5); height: var(--vh); width: calc(var(--vh) * 920 / 280); top: calc(50% - var(--vh) / 2); left: calc(50% - var(--vh) * 920 / 280 / 2); }
  .vband.on { opacity: 1; }
  .vband video { width: 100%; height: 100%; object-fit: fill; display: block; }

  /* 沒有影片時的備案：原地轉的陀螺 */
  .top { opacity: 0; transition: opacity .4s; }
  .top.on { opacity: 1; }
  .squash { position: relative; width: 100%; aspect-ratio: 1; }
  .squash img { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 1.15s linear infinite; }
  .top.red .squash img { animation-direction: reverse; animation-duration: 1.05s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 煙霧（爆炸後鏡頭拉遠時散開） */
  .smoke { inset: 0; pointer-events: none; opacity: 0; }
  .smoke i { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(220,210,200,.55), rgba(150,140,140,.25) 55%, transparent); filter: blur(6px); }
  .smoke.on { animation: smokeOut 1.8s ease-out forwards; }
  .smoke.on i { animation: puff 1.8s ease-out forwards; }
  @keyframes smokeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes puff { from { transform: scale(.4); } to { transform: scale(2.1); } }

  /* 標題兩段 */
  .tA { left: 0; top: 0; width: 100%; height: calc(298 / 1376 * 100%); opacity: 0; transform-origin: 50% 60%; }
  .tB { left: 0; top: calc(298 / 1376 * 100%); width: 100%; height: calc(152 / 1376 * 100%); opacity: 0; }
  .tA img, .tB img { width: 100%; height: 100%; }
  .tA.in { animation: slam .6s cubic-bezier(.2,1.5,.35,1) forwards; }
  @keyframes slam { 0% { opacity: 0; transform: scale(1.6); filter: blur(10px) brightness(2.2); } 55% { opacity: 1; transform: scale(.96); filter: blur(0) brightness(1.4); }
    100% { opacity: 1; transform: none; filter: none; } }
  .tB.in { animation: slideUp .55s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(40%) scaleY(1.3); filter: brightness(2); } 100% { opacity: 1; transform: none; filter: none; } }
  .glint { left: 0; top: 0; width: 100%; height: calc(450 / 1376 * 100%); pointer-events: none; opacity: 0;
    -webkit-mask: url(title_mask.png) center / 100% 100% no-repeat; mask: url(title_mask.png) center / 100% 100% no-repeat; }
  .glint.on { opacity: 1; }
  .glint::before { content: ""; position: absolute; top: -10%; bottom: -10%; width: 26%; left: -40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.95) 45%, rgba(255,240,190,.9) 55%, transparent); transform: skewX(-18deg); }
  .glint.on::before { animation: glint 4.5s .2s infinite; }
  @keyframes glint { 0% { left: -40%; } 28%, 100% { left: 125%; } }

  /* 四大天王：最終位置（特寫退場時本人落進來），之後待機晃動 */
  .king { opacity: 0; transform-origin: 50% 100%; }
  .king img { width: 100%; height: 100%; }
  .king.in { animation: kin .5s cubic-bezier(.2,1.2,.35,1) forwards, idle 2.6s .5s ease-in-out infinite; }
  .k2.in { animation-duration: .5s, 3.1s; } .k3.in { animation-duration: .5s, 2.3s; } .k4.in { animation-duration: .5s, 2.8s; }
  @keyframes kin { 0% { opacity: 0; transform: translateY(-14%) scale(1.25); filter: brightness(6) saturate(0); }
    55% { opacity: 1; transform: translateY(1%) scale(.98); filter: brightness(2.5) saturate(.5); } 100% { opacity: 1; transform: none; filter: none; } }
  @keyframes idle { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-.8%); } }

  /* 四大天王特寫卡：斜切色帶＋速度線＋人物放大＋1P～4P */
  .kcard { inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
  .kcard .band { position: absolute; inset: 0; clip-path: polygon(0 24%, 100% 14%, 100% 74%, 0 84%); background: var(--c);
    box-shadow: inset 0 0 120px rgba(0,0,0,.55); }
  .kcard .band::after { content: ""; position: absolute; inset: 0; opacity: .35;
    background: repeating-linear-gradient(100deg, transparent 0 18px, rgba(255,255,255,.55) 18px 20px, transparent 20px 46px); animation: lines .35s linear infinite; }
  @keyframes lines { to { background-position: 92px 0; } }
  .kcard .edge { position: absolute; inset: 0; clip-path: polygon(0 23%, 100% 13%, 100% 14.4%, 0 24.4%); background: #fff; }
  .kcard .edge.b { clip-path: polygon(0 83.6%, 100% 73.6%, 100% 75%, 0 85%); }
  .kcard img { position: absolute; bottom: 16%; height: 70%; width: auto; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 0 18px rgba(0,0,0,.6)); }
  .kcard .tag { position: absolute; top: 15%; font-family: Impact, "Arial Black", sans-serif; font-style: italic; font-size: calc(var(--w) * .3); line-height: 1;
    background: linear-gradient(180deg, #fff 0%, var(--gold1) 35%, var(--gold2) 65%, var(--gold3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: calc(var(--w) * .005) #1a0d00; filter: drop-shadow(0 5px 0 #000) drop-shadow(0 0 24px rgba(255,170,60,.8)); }
  .kcard.l .tag { left: 6%; } .kcard.r .tag { right: 6%; }
  .kcard.show { animation: cardIn .78s cubic-bezier(.2,.9,.3,1) forwards; }
  .kcard.show img { animation: cardZoom .78s linear forwards; }
  .kcard.show .tag { animation: tagIn .78s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes cardIn { 0% { opacity: 1; transform: translateX(var(--from)); } 18% { transform: none; } 78% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(var(--to)); } }
  @keyframes cardZoom { from { transform: translateX(-50%) scale(1.05); } to { transform: translateX(-50%) scale(1.16); } }
  @keyframes tagIn { 0% { opacity: 0; transform: scale(2.2) skewX(-10deg); } 25% { opacity: 1; transform: scale(1) skewX(-10deg); } 100% { opacity: 1; transform: scale(1.05) skewX(-10deg); } }

  /* 資訊條：左右兩半飛入合體 */
  .bar { left: 0; bottom: 0; width: 100%; height: calc(208 / 1376 * 100%); opacity: 0; }
  .bar.l { clip-path: inset(0 50% 0 0); } .bar.r { clip-path: inset(0 0 0 50%); }
  .bar.in.l { animation: barL .5s cubic-bezier(.2,1.1,.3,1) forwards; } .bar.in.r { animation: barR .5s cubic-bezier(.2,1.1,.3,1) forwards; }
  @keyframes barL { from { opacity: 1; transform: translateX(-100%); } to { opacity: 1; transform: none; } }
  @keyframes barR { from { opacity: 1; transform: translateX(100%); } to { opacity: 1; transform: none; } }
  .count { left: 0; right: 0; bottom: 0; height: calc(100% * 44 / 1376); display: flex; align-items: center; justify-content: center; gap: .5em;
    font-size: calc(var(--w) * .033); font-weight: 900; letter-spacing: .06em; opacity: 0; transition: opacity .6s; }
  .count.on { opacity: 1; }
  .count .k { color: var(--gold2); }
  .count .v { font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,200,80,.5); }

  canvas#fx { inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
  .flash { inset: 0; pointer-events: none; opacity: 0; z-index: 40; mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 50%, rgba(255,252,230,.95), rgba(255,200,120,.35) 22%, transparent 48%); }
  .flash.white { background: #fff; mix-blend-mode: normal; }
  .flash.on { animation: flash .5s ease-out; }
  .flash.long.on { animation-duration: 1.1s; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .stage.shake { animation: shake .32s; } .stage.shake.big { animation: shakeBig .6s; }
  @keyframes shake { 20% { transform: translate(calc(-50% + 5px), calc(-50% - 4px)); } 45% { transform: translate(calc(-50% - 5px), calc(-50% + 3px)); } 70% { transform: translate(calc(-50% + 3px), calc(-50% + 2px)); } }
  @keyframes shakeBig { 10% { transform: translate(calc(-50% + 12px), calc(-50% - 9px)); } 25% { transform: translate(calc(-50% - 12px), calc(-50% + 8px)); }
    40% { transform: translate(calc(-50% + 9px), calc(-50% + 6px)); } 60% { transform: translate(calc(-50% - 6px), calc(-50% - 5px)); } 80% { transform: translate(calc(-50% + 3px), calc(-50% + 2px)); } }

  /* 喊招 */
  .call { left: 0; right: 0; top: 41%; text-align: center; pointer-events: none; opacity: 0; z-index: 35;
    font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif; font-style: italic; letter-spacing: .02em; font-size: calc(var(--w) * .26); line-height: 1; }
  .call b { display: inline-block; background: linear-gradient(180deg, #fff 0%, var(--gold1) 30%, var(--gold2) 60%, var(--gold3) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: calc(var(--w) * .004) #2a1500;
    filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 22px rgba(255,170,60,.85)); padding: 0 .08em; }
  .call.small { font-size: calc(var(--w) * .15); top: 44%; }
  .call.on { animation: call .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes call { 0% { opacity: 0; transform: scale(2.4) skewX(-10deg); } 22% { opacity: 1; transform: scale(1) skewX(-10deg); }
    75% { opacity: 1; transform: scale(1.04) skewX(-10deg); } 100% { opacity: 0; transform: scale(.9) skewX(-10deg); } }

  .ctl { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 50; display: flex; gap: 6px; }
  .ctl button { border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.5); color: #fff; border-radius: 999px; padding: 7px 13px;
    font: 700 13px/1 "Microsoft JhengHei", "PingFang TC", sans-serif; cursor: pointer; backdrop-filter: blur(4px); }
  .ctl button:hover { background: rgba(255,255,255,.16); }
  .ctl button.snd { border-color: rgba(255,201,60,.8); color: #ffd76a; animation: sndHint 1.6s ease-in-out infinite; }
  .ctl button.snd.on { animation: none; color: #fff; border-color: rgba(255,255,255,.35); }
  @keyframes sndHint { 50% { box-shadow: 0 0 0 6px rgba(255,201,60,.25); } }
  .lb { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; padding: 16px; }
  .lb.on { display: flex; }
  .lb img { max-width: 100%; max-height: 100%; border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) { .light.on { animation: none; opacity: 1; } .kcard .band::after { animation: none; } }
</style>
</head>
<body>
<div class="bgblur" id="bgblur"></div>
<div class="stage" id="stage" role="img" aria-label="戰鬥陀螺 2026 LTCUP 黃光盃 G4 第一屆大賽，比賽地點五樓會議室，比賽時間 10/13 17:50">
  <div class="cam" id="cam">
    <img class="base full" id="base" src="base.webp" alt="">
    <div class="haze" id="haze"></div>
    <div class="lights full" id="lights"></div>
    <div class="dimtops" id="dimtops"></div>
    <div class="vband" id="vband"><video id="vid" muted autoplay loop playsinline preload="auto"></video></div>
    <div class="top blue" id="topB"><div class="squash"><img src="top_blue.png" alt=""></div></div>
    <div class="top red" id="topR"><div class="squash"><img src="top_red.png" alt=""></div></div>
    <div class="smoke" id="smoke"></div>
    <div class="king k1" id="k1"><img src="p1.png" alt=""></div>
    <div class="king k2" id="k2"><img src="p2.png" alt=""></div>
    <div class="king k3" id="k3"><img src="p3.png" alt=""></div>
    <div class="king k4" id="k4"><img src="p4.png" alt=""></div>
    <div class="tA" id="tA"><img src="title_a.webp" alt=""></div>
    <div class="tB" id="tB"><img src="title_b.webp" alt=""></div>
    <div class="glint" id="glint"></div>
    <img class="bar l" id="barL" src="bar.webp" alt="">
    <img class="bar r" id="barR" src="bar.webp" alt="">
    <div class="count" id="count"></div>
  </div>
  <div class="kcard l" id="kc1" style="--c: linear-gradient(110deg,#0b2a7a,#2f7bff 60%,#7fd0ff); --from: -110%; --to: 110%;"><div class="band"></div><div class="edge"></div><div class="edge b"></div><img src="p1.png" alt=""><span class="tag">1P</span></div>
  <div class="kcard r" id="kc2" style="--c: linear-gradient(250deg,#5a3500,#e0a000 60%,#ffe27a); --from: 110%; --to: -110%;"><div class="band"></div><div class="edge"></div><div class="edge b"></div><img src="p2.png" alt=""><span class="tag">2P</span></div>
  <div class="kcard l" id="kc3" style="--c: linear-gradient(110deg,#5a0808,#e0321f 60%,#ff9a6a); --from: -110%; --to: 110%;"><div class="band"></div><div class="edge"></div><div class="edge b"></div><img src="p3.png" alt=""><span class="tag">3P</span></div>
  <div class="kcard r" id="kc4" style="--c: linear-gradient(250deg,#2a0a55,#8a3cff 60%,#d2a8ff); --from: 110%; --to: -110%;"><div class="band"></div><div class="edge"></div><div class="edge b"></div><img src="p4.png" alt=""><span class="tag">4P</span></div>
  <canvas id="fx"></canvas>
  <div class="bars" id="bars"></div>
  <div class="call" id="call"><b></b></div>
  <div class="flash" id="flash"></div>
</div>
<div class="ctl"><button type="button" id="sndBtn" class="snd" title="開／關音效（開啟後從頭重播）">🔇 音效</button><button type="button" id="replay">↻ 重播</button><button type="button" id="posterBtn">看海報</button></div>
<div class="lb" id="lb"><img src="poster.webp" alt="戰鬥陀螺 2026 LTCUP 黃光盃 G4 第一屆大賽 海報"></div>

<script>
(function () {
  'use strict';
  var PW = 768, PH = 1376;
  var TOPS = { B: { cx: 207, cy: 618, rx: 205, ry: 170 }, R: { cx: 592, cy: 626, rx: 182, ry: 168 } };
  var KINGS = [[21, 714, 232, 468], [206, 797, 230, 389], [415, 773, 202, 413], [604, 711, 141, 483]];
  var EVENT_AT = new Date(2026, 9, 13, 17, 50, 0);
  var VOFF = 1.2;                                             // 對戰特寫從影片 1.2 秒開始（省掉前面陀螺慢慢靠近的段落）
  var VEV = [[2.65, 'clash'], [6.28, 'boom'], [9.15, 'clash']];   // battle.mp4 撞擊／爆炸秒數
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), cam = $('cam'), vid = $('vid'), vband = $('vband');
  function pct(v, of) { return (v / of * 100) + '%'; }

  // 版面（海報座標）
  function placeTop(el, t) {
    el.style.left = pct(t.cx - t.rx, PW); el.style.top = pct(t.cy - t.rx, PH); el.style.width = pct(t.rx * 2, PW);
    el.querySelector('.squash').style.transform = 'scaleY(' + (t.ry / t.rx) + ')';
  }
  placeTop($('topB'), TOPS.B); placeTop($('topR'), TOPS.R);
  var kings = KINGS.map(function (k, i) {
    var el = $('k' + (i + 1)); el.style.left = pct(k[0], PW); el.style.top = pct(k[1], PH); el.style.width = pct(k[2], PW); el.style.height = pct(k[3], PH); return el;
  });
  // 場館燈 6 盞
  var LIGHTS = [[4, -18, -6], [22, -10, 4], [40, -4, 6], [58, -6, 4], [76, 4, 12], [94, 8, 18]];
  $('lights').innerHTML = LIGHTS.map(function (l) { return '<div class="light" style="left:calc(' + l[0] + '% - 15%);--r0:' + l[1] + 'deg;--r1:' + l[2] + 'deg;transform:rotate(' + l[1] + 'deg)"></div>'; }).join('');
  var lightEls = [].slice.call(document.querySelectorAll('.light'));
  // 煙霧團
  $('smoke').innerHTML = [[18, 40, 40], [50, 36, 52], [82, 42, 40], [34, 54, 34], [66, 56, 36]].map(function (s) {
    return '<i style="left:' + (s[0] - s[2] / 2) + '%;top:' + (s[1] - s[2] / 4) + '%;width:' + s[2] + '%;height:' + (s[2] / 1.6) + '%"></i>'; }).join('');

  /* ── 火花（canvas） ── */
  var cv = $('fx'), ctx = cv.getContext('2d'), P = [], DPR = Math.min(2, window.devicePixelRatio || 1), embersOn = false;
  function size() { cv.width = stage.clientWidth * DPR; cv.height = stage.clientHeight * DPR; }
  window.addEventListener('resize', size); size();
  function burst(n, power, px, py) {
    var x = (px == null ? 384 : px) / PW * cv.width, y = (py == null ? 612 : py) / PH * cv.height;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 11 * power) * DPR;
      P.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2 * DPR, life: 1, decay: .011 + Math.random() * .03,
               hue: Math.random() < .65 ? 38 + Math.random() * 18 : (Math.random() < .5 ? 205 : 8), w: (1 + Math.random() * 2.4) * DPR });
    }
  }
  var embers = [];
  for (var e = 0; e < 36; e++) { embers.push({ x: Math.random(), y: Math.random(), s: .2 + Math.random() * .8, t: Math.random() * 6 }); }
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'lighter';
    if (embersOn) {
      embers.forEach(function (m) {
        m.y -= .0006 * m.s; m.t += .02; if (m.y < -0.05) { m.y = 1.02; m.x = Math.random(); }
        ctx.fillStyle = 'rgba(255,' + (150 + (m.s * 80 | 0)) + ',80,' + (.18 + m.s * .3) + ')';
        ctx.beginPath(); ctx.arc((m.x + Math.sin(m.t) * .01) * cv.width, m.y * cv.height, m.s * 2 * DPR, 0, 6.283); ctx.fill();
      });
    }
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i]; p.x += p.vx; p.y += p.vy; p.vy += .2 * DPR; p.vx *= .985; p.life -= p.decay;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      ctx.strokeStyle = 'hsla(' + p.hue + ',100%,' + (58 + p.life * 35) + '%,' + p.life + ')';
      ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.4, p.y - p.vy * 2.4); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  })();

  /* ── 音效（2026-10-09 使用者：「可以加上音效嗎？」）：Web Audio 即時合成；瀏覽器規定要點一下才能出聲 → 右上「🔇 音效」 ── */
  var SND = (function () {
    var ac = null, master = null, nbuf = null, on = false, hum = null, amb = null;
    function init() {
      if (ac) { return; }
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) { return; }
      ac = new AC();
      var comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      master = ac.createGain(); master.gain.value = 0; master.connect(comp); comp.connect(ac.destination);
      nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      var d = nbuf.getChannelData(0); for (var i = 0; i < d.length; i++) { d[i] = Math.random() * 2 - 1; }
    }
    function now() { return ac.currentTime; }
    function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
    function noise(t, dur, filterType, f0, f1, peak, q) {
      var src = ac.createBufferSource(); src.buffer = nbuf;
      var f = ac.createBiquadFilter(); f.type = filterType; f.Q.value = q || 1; f.frequency.setValueAtTime(f0, t); if (f1) { f.frequency.exponentialRampToValueAtTime(f1, t + dur); }
      var g = ac.createGain(); env(g, t, Math.min(.02, dur / 4), peak, dur);
      src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()); src.stop(t + dur + .1);
    }
    function tone(t, type, f0, f1, dur, peak) {
      var o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) { o.frequency.exponentialRampToValueAtTime(f1, t + dur); }
      var g = ac.createGain(); env(g, t, .005, peak, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .1);
    }
    var fx = {
      beep: function (hi) { var t = now(); tone(t, 'square', hi ? 1320 : 880, 0, .16, .18); tone(t, 'sine', hi ? 660 : 440, 0, .2, .12); },
      launch: function () {   // 拉發射器：越拉越快的棘輪「喀啦喀啦」＋破風
        var t = now(), dt = .034;
        for (var i = 0; i < 24; i++) { noise(t, .018, 'bandpass', 1400 + i * 110, 0, .35, 6); t += dt; dt *= .94; }
        noise(t, .6, 'bandpass', 600, 4000, .5, .8); tone(t, 'sawtooth', 220, 880, .4, .06);
      },
      slam: function () { var t = now(); tone(t, 'sine', 110, 38, .7, .9); noise(t, .35, 'lowpass', 1800, 200, .5); },
      whoosh: function () { noise(now(), .45, 'bandpass', 500, 3200, .35, .9); },
      land: function () { var t = now(); tone(t, 'sine', 90, 45, .4, .6); noise(t, .2, 'lowpass', 1200, 150, .35); },
      metal: function (big) {   // 金屬撞擊：不協和的金屬泛音＋高頻雜訊
        var t = now(), v = big ? 1 : .7;
        [1240, 1873, 2632, 3917, 5210].forEach(function (f, i) { tone(t, 'sine', f * (1 + Math.random() * .02), 0, .5 - i * .06, .14 * v); });
        noise(t, .09, 'highpass', 3000, 0, .5 * v); tone(t, 'sine', 140, 60, .25, .45 * v);
      },
      boom: function () {   // 爆炸：低頻爆破＋往下掃的雜訊＋火花劈啪
        var t = now(); tone(t, 'sine', 95, 28, 1.6, 1); noise(t, 1.3, 'lowpass', 1600, 90, .8);
        for (var i = 0; i < 46; i++) { noise(t + .05 + Math.random() * 1.1, .012, 'highpass', 2500 + Math.random() * 4000, 0, .12 + Math.random() * .2); }
      },
      clack: function () { var t = now(); noise(t, .05, 'highpass', 1800, 0, .5); tone(t, 'sine', 60, 40, .25, .5); },   // 場館燈「喀」一聲亮起
      cheer: function (big) {   // 觀眾歡呼湧上來
        if (!amb) { return; } var g = amb.g.gain, t = now();
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(big ? .22 : .14, t + .25); g.linearRampToValueAtTime(.035, t + (big ? 3 : 2));
      }
    };
    function startLoops() {
      if (!hum) {   // 陀螺高速旋轉：兩組略微走音的鋸齒波＋低通＋5Hz 抖動
        var g = ac.createGain(); g.gain.value = 0; var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
        var o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.type = o2.type = 'sawtooth'; o1.frequency.value = 118; o2.frequency.value = 123;
        var lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 6; lg.gain.value = .012; lfo.connect(lg); lg.connect(g.gain);
        o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); o1.start(); o2.start(); lfo.start();
        hum = { g: g };
      }
      if (!amb) {   // 觀眾席環境音：帶通雜訊，平常很小聲
        var src = ac.createBufferSource(); src.buffer = nbuf; src.loop = true;
        var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = .45;
        var ga = ac.createGain(); ga.gain.value = .035; src.connect(bp); bp.connect(ga); ga.connect(master); src.start();
        amb = { g: ga };
      }
    }
    return {
      on: function () { return on; },
      enable: function () { init(); if (!ac) { return false; } ac.resume(); startLoops(); master.gain.setTargetAtTime(.8, now(), .05); on = true; return true; },
      disable: function () { if (!ac) { return; } master.gain.setTargetAtTime(0, now(), .05); on = false; },
      play: function (name, arg) { if (!on || !ac || !fx[name]) { return; } try { fx[name](arg); } catch (e) {} },
      hum: function (v) { if (!on || !hum) { return; } hum.g.gain.setTargetAtTime(v, now(), .25); }
    };
  })();

  /* ── 小工具：喊招／閃光／震動／重新觸發動畫 ── */
  var callEl = $('call'), flashEl = $('flash');
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function call(txt, small) {
    callEl.querySelector('b').textContent = txt; callEl.className = 'call' + (small ? ' small' : ''); void callEl.offsetWidth; callEl.classList.add('on');
  }
  function flash(kind) { flashEl.className = 'flash' + (kind === 'white' || kind === 'long' ? ' white' : '') + (kind === 'long' ? ' long' : ''); void flashEl.offsetWidth; flashEl.classList.add('on'); }
  function shake(big) { if (reduce) { return; } stage.classList.remove('shake', 'big'); void stage.offsetWidth; stage.classList.add('shake'); if (big) { stage.classList.add('big'); } }
  function camPush(scale, ms) { cam.style.transition = 'transform ' + ms + 'ms cubic-bezier(.3,0,.2,1)'; cam.style.transform = 'scale(' + scale + ')'; }

  /* ── 影片 ── */
  var hasVideo = false, vidLast = 0, vidLive = false;
  vid.addEventListener('loadeddata', function () { hasVideo = true; });
  vid.addEventListener('error', function () { hasVideo = false; });
  vid.src = 'battle.mp4';
  setInterval(function () { if (vidLive && hasVideo && vid.paused && document.visibilityState === 'visible') { vid.play().catch(function () {}); } }, 1000);
  // 影片裡撞擊／爆炸的時間點 → 音效＋震動（特寫時大、定格海報時小）
  var closeup = false;
  (function watch() {
    if (vidLive && hasVideo && !vid.paused) {
      var vt = vid.currentTime;
      VEV.forEach(function (ev) {
        if (vidLast < ev[0] && vt >= ev[0]) {
          if (ev[1] === 'boom') { SND.play('boom'); SND.play('cheer', true); if (closeup) { onBoom(); } else { shake(false); } }
          else { SND.play('metal', true); SND.play('cheer', false); shake(false); if (closeup) { flash('glow'); } }
        }
      });
      vidLast = vt;
    }
    requestAnimationFrame(watch);
  })();

  /* ── 分鏡時間軸 ── */
  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    vidLive = false; closeup = false; vid.pause(); vidLast = 0; SND.hum(0); embersOn = false; P.length = 0;
    cam.style.transition = 'none'; cam.style.transform = 'none';
    ['base', 'dimtops', 'haze', 'glint', 'count', 'bgblur'].forEach(function (id) { $(id).classList.remove('on'); });
    $('lights').classList.remove('dim'); lightEls.forEach(function (l) { l.classList.remove('on'); });
    vband.classList.remove('on'); vband.classList.add('close');
    ['topB', 'topR'].forEach(function (id) { $(id).classList.remove('on'); });
    ['tA', 'tB', 'barL', 'barR'].forEach(function (id) { $(id).classList.remove('in'); });
    kings.forEach(function (k) { k.classList.remove('in'); });
    [1, 2, 3, 4].forEach(function (i) { $('kc' + i).classList.remove('show'); });
    $('smoke').classList.remove('on'); $('bars').classList.remove('on');
  }
  var booming = false;
  function onBoom() {   // 特寫裡的大爆炸 → 全白閃＋大震 → 鏡頭拉遠回海報
    if (booming) { return; } booming = true;
    flash('long'); shake(true); burst(reduce ? 40 : 260, 1.6);
    timers.push(setTimeout(pullBack, 250));
  }
  function pullBack() {
    closeup = false; booming = false;
    $('bars').classList.remove('on'); camPush(1, 1100);
    $('base').classList.add('on'); $('dimtops').classList.add('on'); $('bgblur').classList.add('on');
    $('lights').classList.add('dim'); $('haze').classList.remove('on');
    vband.classList.remove('close');                         // 影片縮回海報中間
    $('smoke').classList.remove('on'); void $('smoke').offsetWidth; $('smoke').classList.add('on');
    embersOn = true;
    var t = 700;
    timers.push(setTimeout(function () { $('tA').classList.add('in'); SND.play('slam'); shake(false); }, t));                    // 戰鬥陀螺 重擊
    timers.push(setTimeout(function () { $('tB').classList.add('in'); SND.play('whoosh'); }, t + 420));                        // 下兩行滑入
    timers.push(setTimeout(function () { $('glint').classList.add('on'); }, t + 900));
    // 四大天王特寫 1P～4P（每張 0.78 秒，退場時本人落進海報位置）
    var k0 = t + 1300;
    KINGS.forEach(function (k, i) {
      var s = k0 + i * 760;
      timers.push(setTimeout(function () { retrigger($('kc' + (i + 1)), 'show'); SND.play('whoosh'); SND.play('beep', true); }, s));
      timers.push(setTimeout(function () { retrigger(kings[i], 'in'); }, s + 560));
      timers.push(setTimeout(function () { burst(reduce ? 15 : 70, .8, k[0] + k[2] / 2, k[1] + k[3] * .97); shake(false); SND.play('land'); }, s + 720));
    });
    var b0 = k0 + 4 * 760 + 300;
    timers.push(setTimeout(function () { $('barL').classList.add('in'); $('barR').classList.add('in'); SND.play('whoosh'); }, b0));   // 資訊條飛入
    timers.push(setTimeout(function () { flash('glow'); SND.play('metal'); shake(false); }, b0 + 470));                            // 合體
    timers.push(setTimeout(function () { $('count').classList.add('on'); }, b0 + 700));
  }
  function play() {
    reset();
    var lit = [0, 5, 1, 4, 2, 3];   // 場館燈：外側往內一盞盞亮
    lit.forEach(function (li, i) { at(150 + i * 230, function () { lightEls[li].classList.add('on'); SND.play('clack'); }); });
    at(900, function () { $('haze').classList.add('on'); });
    at(1500, function () { $('bars').classList.add('on'); camPush(1.06, 1800); });
    at(1600, function () { call('3'); SND.play('beep', false); });
    at(2100, function () { call('2'); SND.play('beep', false); });
    at(2600, function () { call('1'); SND.play('beep', false); });
    at(3100, function () {
      call('GO SHOOT!', true); flash('white'); SND.play('beep', true); SND.play('launch'); SND.hum(.07);
      if (hasVideo) {
        closeup = true; vband.classList.add('close'); vband.classList.add('on');
        try { vid.currentTime = VOFF; } catch (e) {} vidLast = VOFF; vidLive = true; vid.play().catch(function () {});
        camPush(1.0, 400);
        // 保險：影片沒在 7 秒內觸發爆炸（例如被暫停）就自己接下去
        at(6500, function () { if (closeup) { onBoom(); } });   // 影片爆炸預計在 GO 後 5.1 秒
      } else {
        $('topB').classList.add('on'); $('topR').classList.add('on'); $('base').classList.add('on');
        at(1200, function () { burst(reduce ? 30 : 220, 1.3); flash('glow'); shake(false); SND.play('metal', true); SND.play('cheer', false); });
        at(2500, function () { flash('long'); shake(true); SND.play('boom'); SND.play('cheer', true); pullBack(); });
      }
    });
  }
  $('replay').addEventListener('click', play);
  var sndBtn = $('sndBtn');
  sndBtn.addEventListener('click', function () {
    if (SND.on()) { SND.disable(); sndBtn.textContent = '🔇 音效'; sndBtn.classList.remove('on'); return; }
    if (!SND.enable()) { sndBtn.textContent = '此瀏覽器不支援音效'; return; }
    sndBtn.textContent = '🔊 音效'; sndBtn.classList.add('on');
    play();
  });
  play();

  /* ── 開賽倒數 ── */
  var box = $('count');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var ms = EVENT_AT - new Date();
    if (ms <= 0) { box.innerHTML = ms > -3 * 3600e3 ? '<span class="k">🔥 比賽進行中 🔥</span>' : '<span class="k">感謝參賽・下屆見</span>'; return; }
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
    box.innerHTML = '<span class="k">距離開賽</span><span class="v">' + (d ? d + ' 天 ' : '') + pad(Math.floor(s % 86400 / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60) + '</span>';
  }
  tick(); setInterval(tick, 1000);

  var lb = $('lb');
  $('posterBtn').addEventListener('click', function () { lb.classList.add('on'); });
  lb.addEventListener('click', function () { lb.classList.remove('on'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lb.classList.remove('on'); } });
})();
</script>
</body>
</html>
